<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TechWorld - Login</title>

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <div class="container">

        

        <nav>

            <div class="logo">
                💻 TechWorld
            </div>


            <ul class="menu">

                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#">About</a>
                </li>

                <li>
                    <a href="#">Services</a>
                </li>

                <li>
                    <a href="#">Contact</a>
                </li>

                <li>
                    <a href="#" class="active">Login</a>
                </li>

            </ul>

        </nav>



        <div class="content">


            

            <div class="login-section">

                <h1>
                    Welcome Back! 👋
                </h1>

                <p class="subtitle">
                    Sign in to continue to TechWorld
                </p>


                

                <form>

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >



                    <div class="options">

                        <label class="remember">

                            <input type="checkbox">

                            Remember me

                        </label>


                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>



                    <button
                        type="submit"
                        class="login-button">

                        Login

                    </button>



                    <div class="divider">

                        <span>
                            or continue with
                        </span>

                    </div>


                    <div class="social-buttons">

                        <button
                            type="button"
                            class="social">

                            🌐 Google

                        </button>


                        <button
                            type="button"
                            class="social">

                            ▣ Microsoft

                        </button>

                    </div>



                    <p class="signup">

                        Don't have an account?

                        <a href="#">
                            Register
                        </a>

                    </p>

                </form>

            </div>


          

            <div class="welcome-section">



                <div class="illustration">

                    🔒

                </div>


                <h2>
                    Secure, Simple, Smart.
                </h2>


                <p>
                    TechWorld provides secure and smart
                    solutions for a better digital experience.
                </p>



                <div class="dots">

                    <span class="active-dot"></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
